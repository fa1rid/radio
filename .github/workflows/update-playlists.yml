# Rebuilds public/playlists/*.m3u from radio-browser.info daily and commits changes.
# Add country codes to the "Build" step to generate more lists.
# (YAML does not allow tabs, so this file uses spaces.)
name: Update playlists

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: node scripts/build-playlist.mjs SY

      - name: Commit if changed
        if: always()
        run: |
          git add public/playlists
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update playlists from radio-browser.info"
          git push
